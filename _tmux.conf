# change command prefix
unbind C-b
set-option -g prefix C-t

# begin indexing windows at 1
set -g base-index 1

# use all the colours
set -g default-terminal "xterm-256color"

# reload configuration
bind-key r source-file ~/.tmux.conf \; display-message "Configuration reloaded"

# status bar
set -g status-bg colour60
set -g status-fg colour231
set -g status-left " "
set -g status-right "%a %d %b %H:%M "

# active window in status bar
set -g window-status-current-style bg=colour124,fg=colour231

# enable mouse mode
set -g mouse on

# send focus events to the terminal
set -g focus-events on

# pane dividers
set -g pane-border-style fg=colour60
set -g pane-active-border-style fg=colour124
